<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Deploy Smoke Test</title>
<style>
	* { box-sizing: border-box; }
	html, body { margin: 0; padding: 0; }
	body {
		min-height: 100vh;
		display: grid;
		place-items: center;
		font-family: Arial, sans-serif;
		background: linear-gradient(180deg, #ffffff 0%, #f6f9fc 100%);
		color: #1f2937;
		padding: 24px;
	}
	main {
		max-width: 560px;
		width: 100%;
		padding: 28px 26px;
		border: 1px solid rgba(31, 41, 55, 0.1);
		border-radius: 18px;
		background: rgba(255, 255, 255, 0.9);
		box-shadow: 0 12px 30px rgba(31, 41, 55, 0.08);
		text-align: center;
	}
	.eyebrow {
		margin: 0 0 10px;
		font-size: 12px;
		letter-spacing: 0.12em;
		text-transform: uppercase;
		color: #54708a;
		font-weight: 700;
	}
	h1 {
		margin: 0;
		font-size: clamp(28px, 4vw, 42px);
		line-height: 1.05;
		color: #102030;
	}
	p {
		margin: 14px 0 0;
		font-size: 16px;
		line-height: 1.7;
		color: #4b5b6b;
	}
</style>
</head>
<body>
<main>
	<p class="eyebrow">Temporary route</p>
	<h1>Hello, world.</h1>
	<p>This page exists only to verify the deploy pipeline. It is safe to delete.</p>
</main>
</body>
</html>
